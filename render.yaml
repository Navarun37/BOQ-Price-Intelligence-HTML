services:
  - type: web
    name: boq-price-intelligence
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # timeout ยาวเพราะ /api/search ดึงเว็บร้านสดใช้เวลาได้ถึง ~90 วินาที
    startCommand: gunicorn server:app --timeout 180 --workers 2 --threads 8
    healthCheckPath: /
